#cloud-config
package_update: true
package_upgrade: true

users:
  - default
  - name: seadmin
    groups: sudo, docker
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - "ssh-ed25519 REPLACE_WITH_YOUR_PUBLIC_KEY"

packages:
  - ca-certificates
  - curl
  - git
  - jq
  - ufw

runcmd:
  - ufw allow OpenSSH
  - ufw allow 3000/tcp
  - ufw --force enable
  - echo "Cloud-init complete. Run deploy/nutanix/bootstrap-ubuntu.sh next."
